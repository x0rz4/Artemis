services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artemis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artemis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artemis:
    image: ${ARTEX_IMAGE:-ghcr.io/x0rz4/artemis}:${ARTEX_TAG:-latest}
    build:
      context: .
      args:
        ARTEX_BUILD_VERSION: ${ARTEX_BUILD_VERSION:-dev}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # pgx reads PG* defaults: credentials need no URI escaping.
      ARTEX_PG_DSN: host=postgres port=5432 sslmode=disable
      ARTEX_JWT_KEY_DIR: /app/auth
      PGUSER: ${POSTGRES_USER:-artemis}
      PGPASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-artemis}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    ports:
      - "${ARTEX_BIND:-127.0.0.1}:${ARTEX_PORT:-8787}:8787"
      - "127.0.0.1:${ARTEX_PROXY_PORT:-8788}:8788"
    volumes:
      # 录制与工作区；JWT 独立存储，避免被文件管理器浏览或下载。
      - ./data:/app/data
      - authdata:/app/auth
      # 保留宿主机技能修改；上传/同步技能保存在 data/skills。
      - ./skills:/app/skills
    init: true
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
  authdata:
