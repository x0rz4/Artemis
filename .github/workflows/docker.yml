name: container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested image to GHCR
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      version: ${{ steps.image.outputs.version }}
      publish: ${{ steps.image.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine image and version
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          version="sha-${COMMIT:0:12}"
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
              echo 'Expected a tag such as v2.3.0 or v2.3.0-rc.1' >&2; exit 1;
            }
            version="${REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          publish=false
          if [[ "$EVENT" == push || ( "$EVENT" == workflow_dispatch && "$PUBLISH" == true ) ]]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Validate installer and Compose
        env:
          POSTGRES_PASSWORD: ci-validation-only
        run: |
          for script in install.sh build.sh start.sh; do bash -n "$script"; done
          shellcheck install.sh start.sh
          python3 -m unittest discover -s scripts -p 'test_install.py' -v
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.local.yml config --quiet

  build:
    needs: validate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build a native image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: artemis:ci
          build-args: ARTEX_BUILD_VERSION=${{ needs.validate.outputs.version }}
          labels: |
            org.opencontainers.image.title=Artemis
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
      - name: Test initialization, auth, empty business data and restart
        run: python3 scripts/smoke_container.py artemis:ci
      - name: Log in to GHCR
        if: needs.validate.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the exact image that passed smoke tests
        if: needs.validate.outputs.publish == 'true'
        id: push
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          tag="$IMAGE:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$ARCH"
          docker tag artemis:ci "$tag"
          docker push "$tag"
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$tag")
          echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"
      - name: Export digest
        if: needs.validate.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        if: needs.validate.outputs.publish == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [validate, build]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ needs.validate.outputs.image }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
      - name: Publish multi-platform tags only after both architectures pass
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done <<< "$TAGS"
          for digest in *; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || exit 1
            args+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"
          {
            echo '### Artemis images'
            printf '%s\n' "$TAGS"
            echo 'Platforms: linux/amd64, linux/arm64; both passed isolated smoke tests.'
          } >> "$GITHUB_STEP_SUMMARY"
